name: 데이터 업데이트 & 배포

on:
  schedule:
    - cron: "30 9 * * *"   # 매일 09:30 UTC = 18:30 KST (한국장 마감 반영)
    - cron: "10 22 * * *"  # 매일 22:10 UTC = 07:10 KST (전날 밤 미국장 마감 반영)
    - cron: "10 5,6 * * 4" # 목요일 14:10 · 15:10 KST: 부동산원 주간 아파트 동향만 (15시는 늦게 올라올 때 대비)
  workflow_dispatch:        # Actions 탭에서 수동 실행
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 신고가 판단용 단지별 최고가표 (사이트에 올리지 않고 캐시에만 보관, 매 실행마다 최신본으로 교체)
      - name: 최고가표 불러오기
        uses: actions/cache/restore@v4
        with:
          path: state
          key: rt-state-${{ github.run_id }}
          restore-keys: rt-state-

      - name: 지표 수집
        run: python3 scripts/fetch_data.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          WEEKLY_ONLY: ${{ github.event.schedule == '10 5,6 * * 4' && '1' || '' }}

      - name: 최고가표 저장
        if: always() && hashFiles('state/rt_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: rt-state-${{ github.run_id }}

      - name: data.json 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/kb_weekly.json 2>/dev/null || git add data/data.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') 업데이트"
            git pull --rebase
            git push
          fi

      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
